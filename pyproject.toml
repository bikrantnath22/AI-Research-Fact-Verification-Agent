[project]
name = "research-agent"
version = "0.1.0"
description = "Multi-agent AI research & fact-verification system with LangGraph, Qdrant, and MCP"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",

    # LLM
    "groq>=0.12.0",

    # Embeddings (CPU-only, lean install)
    "sentence-transformers>=3.0.0",

    # Vector DB
    "qdrant-client>=1.10.0",

    # Web search
    "tavily-python>=0.4.0",

    # NLI (remote via HF Inference API)
    "aiohttp>=3.9.0",

    # MCP
    "mcp>=1.0.0",

    # Backend
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Document processing
    "PyPDF2>=3.0.0",

    # Config
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "mcp_servers*"]
